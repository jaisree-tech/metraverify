version: "3.8"

services:
  db:
    image: postgres:16
    container_name: metraverify_db
    restart: always
    environment:
      POSTGRES_USER: metra_user
      POSTGRES_PASSWORD: metra_pass
      POSTGRES_DB: metraverify
    ports:
      - "5432:5432"
    volumes:
      - metraverify_pgdata:/var/lib/postgresql/data

volumes:
  metraverify_pgdata:
